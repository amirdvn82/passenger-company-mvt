<!DOCTYPE html>
<html>
<head>
    <title>Buy Ticket</title>
</head>
<body>

<h2>Buy Ticket</h2>

{% if form.non_field_errors %}
<div style="color:red;">
    {{ form.non_field_errors }}
</div>
{% endif %}

<form method="post">
    {% csrf_token %}
    
    <p>
        {{ form.trip_id.label_tag }}
        {{ form.trip_id }}
    </p>

    <p>
        {{ form.seat_number.label_tag }}
        {{ form.seat_number }}
    </p>

    <button type="submit">Buy Ticket</button>
</form>

</body>
</html>
