{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>My Wallet</h2>
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Current Balance</h5>
            <p class="card-text display-4">{{ wallet.balance|floatformat:0 }} Dollars </p>
            <a href="{% url 'wallets:wallet-charge' %}" class="btn btn-primary">Charge Wallet</a>
            <a href="{% url 'wallets:transaction-list' %}" class="btn btn-secondary">Transaction History</a>
        </div>
    </div>
</div>
{% endblock %}
